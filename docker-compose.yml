version: '3.8'

services:
  # MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: elitegym-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: elite_gym
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - elitegym-network

  # Spring Boot 3.3.0 REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elitegym-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/elite_gym?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JPA_DDL_AUTO: update
      SHOW_SQL: false
      JWT_SECRET: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWVsaXRlLWd5bS1qd3QtYXV0aGVudGljYXRpb24tMjAyNg==
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - elitegym-network

  # React SPA Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elitegym-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - elitegym-network

# Persistent Data Storage
volumes:
  mysql_data:
    driver: local

# Internal Bridge Network
networks:
  elitegym-network:
    driver: bridge