# ==============================================================================
# Production Configuration Profile (application-prod.properties)
# Elite Athletic Club (Madurai, TN)
# ==============================================================================
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/elite_gym?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate DDL Strategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Jackson Serializer
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWVsaXRlLWd5bS1qd3QtYXV0aGVudGljYXRpb24tMjAyNg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging Configuration
logging.level.root=INFO
logging.level.com.elitegym=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
