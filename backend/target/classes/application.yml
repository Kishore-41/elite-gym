server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: elite-gym-backend
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/elite_gym?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

# JWT Security Configuration Properties
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWVsaXRlLWd5bS1qd3QtYXV0aGVudGljYXRpb24tMjAyNg==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours

# Logging Configuration
logging:
  level:
    root: INFO
    com.elitegym: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
